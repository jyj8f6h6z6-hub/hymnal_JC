<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f8fafc"
  >

  <title>詩歌</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/desktop-icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./images/desktop-icon-180.png">

  <link
    rel="stylesheet"
    href="./style.css"
  >

</head>


<body>


  <div class="app">


    <!-- =========================
         頁首
    ========================== -->

    <header class="header">

      <div>

        <div class="eyebrow">
          HYMN
        </div>

        <h1>
          詩歌
        </h1>

      </div>


      <!-- 主題切換 -->

      <button
        id="themeButton"
        class="theme-button"
        type="button"
        aria-label="切換顯示主題"
        title="切換顯示主題"
      >

        <span aria-hidden="true">
          ◐
        </span>

        <span id="themeName">
          灰藍
        </span>

      </button>

    </header>



    <!-- =========================
         選擇詩歌本
    ========================== -->

    <section class="book-section">

      <div class="section-title">
        選擇詩歌本
      </div>


      <div
        id="bookList"
        class="book-list"
      ></div>

    </section>



    <!-- =========================
         搜尋詩歌
    ========================== -->

    <section class="search-section">

      <div class="section-title">
        搜尋詩歌
      </div>

      <div class="search-box">

        <span
          class="search-icon"
          aria-hidden="true"
        >⌕</span>

        <input
          id="searchInput"
          class="search-input"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="輸入歌號、歌名或歌詞"
          aria-label="搜尋歌號、歌名或歌詞"
        >

        <button
          id="searchClear"
          class="search-clear hidden"
          type="button"
          aria-label="清除搜尋"
        >×</button>

      </div>

      <div
        id="searchSummary"
        class="search-summary hidden"
        aria-live="polite"
      ></div>

      <div
        id="searchResults"
        class="search-results hidden"
      ></div>

    </section>



    <!-- =========================
         選擇歌號
    ========================== -->

    <section class="number-section">


      <div class="number-header">


        <div>

          <div class="section-title">
            選擇歌號
          </div>

          <div
            id="currentBookName"
            class="current-book-name"
          >
            詩歌本
          </div>

        </div>


        <div
          id="numberDisplay"
          class="number-display"
          aria-live="polite"
        >
          0001
        </div>


      </div>



      <!-- =========================
           四位數滾輪
      ========================== -->

      <div class="wheel-panel">


        <!-- 中央選取框 -->

        <div
          class="selection-window"
          aria-hidden="true"
        ></div>



        <!-- 千位 -->

        <div class="wheel-column">

          <div
            id="wheelThousands"
            class="wheel"
            data-place="1000"
            tabindex="0"
            aria-label="千位數"
          ></div>
</div>



        <!-- 百位 -->

        <div class="wheel-column">

          <div
            id="wheelHundreds"
            class="wheel"
            data-place="100"
            tabindex="0"
            aria-label="百位數"
          ></div>
</div>



        <!-- 十位 -->

        <div class="wheel-column">

          <div
            id="wheelTens"
            class="wheel"
            data-place="10"
            tabindex="0"
            aria-label="十位數"
          ></div>
</div>



        <!-- 個位 -->

        <div class="wheel-column">

          <div
            id="wheelOnes"
            class="wheel"
            data-place="1"
            tabindex="0"
            aria-label="個位數"
          ></div>
</div>


      </div>


    </section>



    <!-- =========================
         詩歌顯示
    ========================== -->

    <main
      id="hymnArea"
      class="hymn-area"
    >


      <!-- 初始畫面 -->

      <div
        id="emptyState"
        class="empty-state"
      >

        <div
          class="empty-icon"
          aria-hidden="true"
        >
          ♫
        </div>

        <div class="empty-title">
          選擇詩歌
        </div>

        <div class="empty-text">
          選擇詩歌本，再滑動數字滾輪
        </div>

      </div>



      <!-- 詩歌 -->

      <article
        id="hymnCard"
        class="hymn-card hidden"
      >


        <div class="hymn-top">


          <div>

            <div
              id="hymnBook"
              class="hymn-book"
            ></div>

            <h2
              id="hymnTitle"
              class="hymn-title"
            ></h2>

          </div>


          <div
            id="hymnNumber"
            class="hymn-number"
          ></div>


        </div>



        <div class="divider"></div>



        <div
          id="hymnLyrics"
          class="hymn-lyrics"
        ></div>


      </article>



      <!-- 找不到 -->

      <div
        id="notFound"
        class="not-found hidden"
      >

        <div
          id="notFoundNumber"
          class="not-found-number"
        >
          0000
        </div>

        <div class="not-found-title">
          找不到這首詩歌
        </div>

        <div class="not-found-text">
          請確認詩歌本與歌號
        </div>

      </div>


    </main>


  </div>



  <!-- =========================
       JS

       hymns.js 必須先載入
  ========================== -->

  <script src="./hymns.js"></script>

  <script src="./app.js"></script>


</body>

</html>
