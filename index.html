<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#f8fafc">

  <title>詩歌</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/desktop-icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./images/desktop-icon-180.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <h1>詩歌</h1>
        <div class="brand-subtitle">選歌號或直接搜尋</div>
      </div>

      <button
        id="themeButton"
        class="theme-button"
        type="button"
        aria-label="切換顯示主題"
        title="切換顯示主題"
      >
        <span aria-hidden="true">◐</span>
        <span id="themeName">灰藍</span>
      </button>
    </header>

    <section class="book-section" aria-label="選擇詩歌本">
      <div id="bookList" class="book-list"></div>
    </section>

    <section class="search-section" aria-label="搜尋詩歌">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="searchInput"
          class="search-input"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="搜尋歌號、歌名或歌詞"
          aria-label="搜尋歌號、歌名或歌詞"
        >

        <button
          id="searchClear"
          class="search-clear hidden"
          type="button"
          aria-label="清除搜尋"
        >×</button>
      </div>

      <div
        id="searchSummary"
        class="search-summary hidden"
        aria-live="polite"
      ></div>

      <div
        id="searchResults"
        class="search-results hidden"
      ></div>
    </section>

    <section class="number-section" aria-label="選擇歌號">
      <div class="number-header">
        <div>
          <div class="number-hint">目前詩歌本</div>
          <div
            id="currentBookName"
            class="current-book-name"
          >詩歌本</div>
        </div>

        <div
          id="numberDisplay"
          class="number-display"
          aria-live="polite"
        >0001</div>
      </div>

      <div class="wheel-panel">
        <div
          class="selection-window"
          aria-hidden="true"
        ></div>

        <div class="wheel-column">
          <div
            id="wheelThousands"
            class="wheel"
            data-place="1000"
            tabindex="0"
            aria-label="千位數"
          ></div>
        </div>

        <div class="wheel-column">
          <div
            id="wheelHundreds"
            class="wheel"
            data-place="100"
            tabindex="0"
            aria-label="百位數"
          ></div>
        </div>

        <div class="wheel-column">
          <div
            id="wheelTens"
            class="wheel"
            data-place="10"
            tabindex="0"
            aria-label="十位數"
          ></div>
        </div>

        <div class="wheel-column">
          <div
            id="wheelOnes"
            class="wheel"
            data-place="1"
            tabindex="0"
            aria-label="個位數"
          ></div>
        </div>
      </div>

      <div class="wheel-help">上下滑動數字選歌</div>
    </section>

    <main
      id="hymnArea"
      class="hymn-area"
    >
      <div
        id="emptyState"
        class="empty-state"
      >
        <div class="empty-icon" aria-hidden="true">♫</div>
        <div class="empty-title">選一首詩歌</div>
        <div class="empty-text">滑動歌號，或從上方搜尋</div>
      </div>

      <article
        id="hymnCard"
        class="hymn-card hidden"
      >
        <div class="hymn-top">
          <div>
            <div
              id="hymnBook"
              class="hymn-book"
            ></div>

            <h2
              id="hymnTitle"
              class="hymn-title"
            ></h2>
          </div>

          <div
            id="hymnNumber"
            class="hymn-number"
          ></div>
        </div>

        <div class="divider"></div>

        <div
          id="hymnLyrics"
          class="hymn-lyrics"
        ></div>
      </article>

      <div
        id="notFound"
        class="not-found hidden"
      >
        <div
          id="notFoundNumber"
          class="not-found-number"
        >0000</div>

        <div class="not-found-title">找不到這首詩歌</div>
        <div class="not-found-text">請確認詩歌本與歌號</div>
      </div>
    </main>

  </div>

  <script src="./hymns.js"></script>
  <script src="./app.js"></script>
</body>
</html>
