<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#f8fafc">

  <title>詩歌</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/desktop-icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./images/desktop-icon-180.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <h1>詩歌</h1>
        <div class="brand-subtitle">選歌號或直接搜尋</div>
      </div>

      <div class="header-actions">
        <button id="feedbackButton" class="feedback-button" type="button" aria-label="許願／回報" title="許願／回報">
          <span aria-hidden="true">💡</span>
          <span class="feedback-label">許願／回報</span>
        </button>

        <button
        id="themeButton"
        class="theme-button"
        type="button"
        aria-label="切換顯示主題"
        title="切換顯示主題"
      >
        <span aria-hidden="true">◐</span>
        <span id="themeName">灰藍</span>
      </button>
      </div>
    </header>

    <section class="book-section" aria-label="選擇詩歌本">
      <div id="bookList" class="book-list"></div>
    </section>


    <section class="number-section" aria-label="選擇歌號">
      <div class="number-header">
        <div>
          <div class="number-hint">目前詩歌本</div>
          <div
            id="currentBookName"
            class="current-book-name"
          >詩歌本</div>
        </div>

        <div
          id="numberDisplay"
          class="number-display"
          aria-live="polite"
        >0001</div>
      </div>

      <div class="wheel-panel">
        <div
          class="selection-window"
          aria-hidden="true"
        ></div>

        <div class="wheel-column">
          <div
            id="wheelThousands"
            class="wheel"
            data-place="1000"
            tabindex="0"
            aria-label="千位數"
          ></div>
        </div>

        <div class="wheel-column">
          <div
            id="wheelHundreds"
            class="wheel"
            data-place="100"
            tabindex="0"
            aria-label="百位數"
          ></div>
        </div>

        <div class="wheel-column">
          <div
            id="wheelTens"
            class="wheel"
            data-place="10"
            tabindex="0"
            aria-label="十位數"
          ></div>
        </div>

        <div class="wheel-column">
          <div
            id="wheelOnes"
            class="wheel"
            data-place="1"
            tabindex="0"
            aria-label="個位數"
          ></div>
        </div>
      </div>

      <div class="wheel-help">上下滑動數字選歌</div>
    </section>

    <section class="search-section" aria-label="搜尋詩歌">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="searchInput"
          class="search-input"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="不知道歌號？搜尋歌名或歌詞"
          aria-label="不知道歌號時，搜尋歌名或歌詞"
        >

        <button
          id="searchClear"
          class="search-clear hidden"
          type="button"
          aria-label="清除搜尋"
        >×</button>
      </div>

      <div
        id="searchSummary"
        class="search-summary hidden"
        aria-live="polite"
      ></div>

      <div
        id="searchResults"
        class="search-results hidden"
      ></div>
    </section>


    <main
      id="hymnArea"
      class="hymn-area"
    >
      <div
        id="emptyState"
        class="empty-state"
      >
        <div class="empty-icon" aria-hidden="true">♫</div>
        <div class="empty-title">選一首詩歌</div>
        <div class="empty-text">滑動歌號，或從上方搜尋</div>
      </div>

      <article
        id="hymnCard"
        class="hymn-card hidden"
      >
        <div class="hymn-top">
          <div>
            <div
              id="hymnBook"
              class="hymn-book"
            ></div>

            <h2
              id="hymnTitle"
              class="hymn-title"
            ></h2>
          </div>

          <div
            id="hymnNumber"
            class="hymn-number"
          ></div>
        </div>

        <div class="divider"></div>

        <div
          id="hymnLyrics"
          class="hymn-lyrics"
        ></div>
      </article>

      <div
        id="notFound"
        class="not-found hidden"
      >
        <div
          id="notFoundNumber"
          class="not-found-number"
        >0000</div>

        <div class="not-found-title">找不到這首詩歌</div>
        <div class="not-found-text">請確認詩歌本與歌號</div>
      </div>
    </main>

  </div>

  <div id="feedbackModal" class="feedback-modal hidden" aria-hidden="true">
    <div class="feedback-backdrop" data-feedback-close></div>
    <div class="feedback-dialog" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
      <button class="feedback-close" type="button" aria-label="關閉" data-feedback-close>×</button>
      <h2 id="feedbackTitle">許願／回報</h2>
      <p>想告訴我們什麼？</p>
      <div class="feedback-choices">
        <button id="reportErrorButton" type="button" class="feedback-choice">
          <span class="feedback-choice-icon">🐛</span><span><strong>錯誤回報</strong><small>回報目前詩歌的歌詞、歌名或顯示問題</small></span>
        </button>
        <button id="requestSongButton" type="button" class="feedback-choice">
          <span class="feedback-choice-icon">🎵</span><span><strong>增加詩歌需求</strong><small>許願希望加入 Hymnal JC 的詩歌</small></span>
        </button>
      </div>
    </div>
  </div>

  <script src="./hymns.js"></script>
  <script src="./app.js"></script>
  <script src="./enhancements.js"></script>

  <!-- v2.2：自動檢查更新。啟動時＋回到前景時檢查，5 分鐘內最多一次。 -->
  <script>
    if ("serviceWorker" in navigator) {
      let lastUpdateCheck = 0;
      const UPDATE_CHECK_INTERVAL = 5 * 60 * 1000;

      // v2.3.2：自動同步核心檔案。
      // 以條件式請求（ETag）比對線上與快取中的檔案，內容不同就更新快取，
      // 之後只要回到 App 就會重新載入新版，不必再手動升 CACHE_VERSION。
      const SYNC_FILES = ["./index.html", "./style.css", "./hymns.js", "./app.js", "./enhancements.js", "./manifest.webmanifest"];
      let needReload = false;

      async function syncCoreFiles() {
        if (!("caches" in window)) return;
        const keys = await caches.keys();
        const coreKey = keys.find((k) => k.startsWith("hymnal-offline-") && k.endsWith("-core"));
        if (!coreKey) return;
        const cache = await caches.open(coreKey);
        for (const file of SYNC_FILES) {
          try {
            const url = new URL(file, location.href).href;
            const fresh = await fetch(url, { cache: "no-cache" });
            if (!fresh.ok) continue;
            const cached = await cache.match(url);
            let changed = !cached;
            if (cached) {
              const a = fresh.headers.get("etag");
              const b = cached.headers.get("etag");
              changed = a && b ? a !== b : (await fresh.clone().text()) !== (await cached.clone().text());
            }
            if (changed) {
              await cache.put(url, fresh.clone());
              needReload = true;
            }
          } catch (error) {
            // 離線或網路失敗時略過，繼續使用快取。
          }
        }
      }

      async function checkForAppUpdate(registration, force = false) {
        const now = Date.now();
        if (!force && now - lastUpdateCheck < UPDATE_CHECK_INTERVAL) return;
        lastUpdateCheck = now;
        try {
          await registration.update();
        } catch (error) {
          console.warn("新版檢查失敗：", error);
        }
        await syncCoreFiles();
      }

      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register("./service-worker.js", {
            updateViaCache: "none"
          });

          // v2.3.1：新版接手後，等使用者離開再回到 App 時才重新載入，不打斷閱讀。
          let hadController = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (hadController) needReload = true;
            hadController = true;
          });
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible" && needReload) {
              needReload = false;
              location.reload();
            }
          });

          // 每次啟動 App 都立即檢查一次。
          await checkForAppUpdate(registration, true);

          // 從背景回到前景時再檢查；5 分鐘內不重複。
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
              checkForAppUpdate(registration);
            }
          });
        } catch (error) {
          console.warn("離線功能註冊失敗：", error);
        }
      });

      // v2.3.1：新版立即啟用；畫面於使用者回到 App 時才重新載入，閱讀中不會被打斷。
    }
  </script>
</body>
</html>
